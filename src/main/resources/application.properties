spring.application.name=clinic-booking-app

# ---------------------------------------------------------------------------
# PostgreSQL connection
# Locally: falls back to your existing local Postgres (unchanged).
# On Render: DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD env vars
# (set in Part 4 below) override these defaults automatically.
# ---------------------------------------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/clinic_db}
spring.datasource.username=${DATABASE_USERNAME:clinic_user}
spring.datasource.password=${DATABASE_PASSWORD:clinic_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Server - PORT is supplied automatically by Render at runtime; 8080 stays
# the local default.
# ---------------------------------------------------------------------------
server.port=${PORT:8080}

clinic.default-patient-cap=45
clinic.default-admin-cap=60
clinic.arrival-window-text=9 AM - 12 PM
clinic.test-runner.enabled=false

# ---------------------------------------------------------------------------
# Same pattern: real JWT secret and admin credentials will be set as
# Render environment variables (Part 4), never committed to GitHub as
# plain text. Local defaults below are only used when running on your PC.
# ---------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:iMwswqjMWwsl5hUyfmNod8RW0XKRc+saGubvqZarxUs=}
jwt.expiration-ms=86400000
otp.expiry-minutes=5

admin.username=${ADMIN_USERNAME:clinicadmin}
admin.password=${ADMIN_PASSWORD:ChangeThisSecurePassword123}

logging.level.com.clinic.booking=DEBUG
logging.level.org.hibernate.SQL=DEBUG